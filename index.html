<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>耳コピDeck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e12;
  --surface:#15181e;
  --surface-2:#1d2129;
  --line:#282d36;
  --text:#eceef1;
  --muted:#868c98;
  --muted-2:#565c66;
  --amber:#e8a33d;
  --amber-dim:#5c451f;
  --teal:#45d6a4;
  --teal-dim:#1f4e40;
  --red:#e2645f;
  --radius:10px;
  --font-display:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-display);
}
.app{display:flex;height:100vh;width:100vw;}

/* ---------- sidebar ---------- */
.sidebar{
  width:320px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:16px 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

.urlbar{display:flex;flex-direction:column;gap:8px;}
.urlbar input[type=text]{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:var(--radius);padding:10px 12px;font-family:var(--font-mono);font-size:12.5px;
}
.urlbar input[type=text]:focus{outline:2px solid var(--amber);outline-offset:-1px;}
.btn{
  border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  border-radius:var(--radius);padding:10px 14px;font-family:var(--font-display);font-weight:700;
  font-size:13px;cursor:pointer;transition:.15s ease;
}
.btn:hover{border-color:var(--muted-2);}
.btn.primary{background:var(--amber);color:#241a08;border-color:var(--amber);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.small{padding:7px 10px;font-size:11.5px;}
.msg{font-size:11.5px;color:var(--red);font-family:var(--font-mono);min-height:14px;}

.block{border-top:1px solid var(--line);padding-top:14px;}
.block h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700;}

.abrow{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.abbox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
.abbox.a{border-left:3px solid var(--teal);}
.abbox.b{border-left:3px solid var(--red);}
.abbox label{font-size:10px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.05em;display:block;margin-bottom:6px;}
.abbox .row{display:flex;gap:6px;align-items:center;}
.abbox input[type=text]{
  flex:1;min-width:0;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--text);
  font-family:var(--font-mono);font-size:13px;padding:5px 2px;
}
.nudgebtn{
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:5px 7px;font-size:11px;cursor:pointer;font-family:var(--font-mono);flex:none;
}
.nudgebtn:hover{color:var(--text);border-color:var(--muted-2);}
.usecur{
  margin-top:6px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);
  border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;font-family:var(--font-mono);
}
.usecur:hover{color:var(--text);border-color:var(--muted-2);}

.looptoggle{display:flex;align-items:center;gap:10px;margin:12px 0 12px;}
.switch{position:relative;width:38px;height:21px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider-sw{position:absolute;inset:0;background:var(--bg);border:1px solid var(--line);border-radius:20px;cursor:pointer;transition:.15s;}
.slider-sw:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.15s;}
.switch input:checked + .slider-sw{background:var(--teal-dim);border-color:var(--teal);}
.switch input:checked + .slider-sw:before{transform:translateX(17px);background:var(--teal);}
.looptoggle span{font-size:12px;color:var(--muted);font-family:var(--font-mono);}

.savepresetrow{display:flex;gap:6px;}
.savepresetrow input{
  flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:8px 10px;font-family:var(--font-display);font-size:12px;
}

.speedgrid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.speedbtn{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:7px 11px;font-family:var(--font-mono);font-size:12px;cursor:pointer;
}
.speedbtn:hover{border-color:var(--muted-2);}
.speedbtn.active{background:var(--amber);color:#241a08;border-color:var(--amber);font-weight:700;}
.customrow{display:flex;align-items:center;gap:8px;}
.customrow input[type=range]{flex:1;accent-color:var(--amber);}
.customrow .val{font-family:var(--font-mono);font-size:12px;color:var(--amber);width:40px;text-align:right;}

.list{display:flex;flex-direction:column;gap:7px;}
.item{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:7px 8px;
}
.item .thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;flex:none;background:var(--bg);}
.item .info{flex:1;min-width:0;}
.item .name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .meta{font-size:10.5px;color:var(--muted-2);font-family:var(--font-mono);}
.item .acts{display:flex;gap:4px;flex:none;}
.item .acts button{
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  width:24px;height:24px;font-size:11px;cursor:pointer;
}
.item .acts button:hover{color:var(--text);border-color:var(--muted-2);}
.empty-list{color:var(--muted-2);font-family:var(--font-mono);font-size:11.5px;}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:16px 18px;gap:12px;}
.stage{
  flex:1;min-height:0;background:#000;border-radius:14px;overflow:hidden;position:relative;
  border:1px solid var(--line);
}
#player{position:absolute;inset:0;width:100%;height:100%;}
.click-shield{position:absolute;inset:0;z-index:5;cursor:pointer;background:transparent;}

.transport{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px 12px;flex:none;
}
.seekrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.time{font-family:var(--font-mono);font-size:12px;color:var(--muted);width:48px;flex:none;}
.time.end{text-align:right;}
.seek-outer{position:relative;flex:1;height:24px;display:flex;align-items:center;}
.seek-track{position:absolute;left:0;right:0;height:6px;top:9px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
.seek-fill{position:absolute;left:0;top:0;bottom:0;background:var(--muted-2);width:0%;}
.loop-band{position:absolute;top:0;bottom:0;background:var(--teal-dim);opacity:.6;display:none;}
.seek-range{position:absolute;left:0;right:0;top:0;width:100%;height:24px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;}
.seek-range::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--amber);border:2px solid #241a08;margin-top:0;cursor:grab;}
.seek-range::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:2px solid #241a08;cursor:grab;}
.marker{position:absolute;top:0;width:2px;height:24px;background:var(--teal);z-index:2;}
.marker .tag{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--teal);background:#0c0e12;padding:0 3px;border-radius:3px;}
.marker.end{background:var(--red);}
.marker.end .tag{color:var(--red);}

.ctrlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.playbtn{
  width:40px;height:40px;border-radius:50%;background:var(--amber);border:none;color:#241a08;
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
}
.playbtn:hover{filter:brightness(1.08);}
.iconbtn{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:8px 11px;font-family:var(--font-mono);font-size:11.5px;cursor:pointer;
}
.iconbtn:hover{border-color:var(--muted-2);}
.spacer{flex:1;}
.rate-badge{font-family:var(--font-mono);font-size:12px;color:var(--amber);background:var(--amber-dim);padding:7px 10px;border-radius:8px;white-space:nowrap;}

@media(max-width:820px){
  html,body{overflow:auto;}
  .app{flex-direction:column;height:auto;min-height:100vh;}
  .sidebar{width:100%;max-height:44vh;border-right:none;border-bottom:1px solid var(--line);}
  .main{padding:12px;}
  .stage{aspect-ratio:16/9;flex:none;}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="urlbar">
      <input type="text" id="urlInput" placeholder="YouTube URL">
      <button class="btn primary" id="loadBtn">読み込む</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="block">
      <h2>ループ A/B</h2>
      <div class="abrow">
        <div class="abbox a">
          <label>開始 A</label>
          <div class="row">
            <button class="nudgebtn" data-t="start" data-d="-1">−1s</button>
            <input type="text" id="startInput" value="0:00">
            <button class="nudgebtn" data-t="start" data-d="1">+1s</button>
          </div>
          <button class="usecur" id="setA">現在地から設定</button>
        </div>
        <div class="abbox b">
          <label>終了 B</label>
          <div class="row">
            <button class="nudgebtn" data-t="end" data-d="-1">−1s</button>
            <input type="text" id="endInput" value="0:00">
            <button class="nudgebtn" data-t="end" data-d="1">+1s</button>
          </div>
          <button class="usecur" id="setB">現在地から設定</button>
        </div>
      </div>
      <div class="looptoggle">
        <label class="switch">
          <input type="checkbox" id="loopToggle">
          <span class="slider-sw"></span>
        </label>
        <span id="loopStatus">ループ OFF</span>
      </div>
      <div class="savepresetrow">
        <input type="text" id="presetName" placeholder="名前を付けて保存" maxlength="40">
        <button class="btn small" id="savePreset">保存</button>
      </div>
    </div>

    <div class="block">
      <h2>保存済み</h2>
      <div class="list" id="presetList"><div class="empty-list">なし</div></div>
    </div>

    <div class="block">
      <h2>速度</h2>
      <div class="speedgrid" id="speedGrid">
        <button class="speedbtn" data-rate="0.5">0.5x</button>
        <button class="speedbtn" data-rate="0.7">0.7x</button>
        <button class="speedbtn" data-rate="0.8">0.8x</button>
        <button class="speedbtn" data-rate="0.9">0.9x</button>
        <button class="speedbtn active" data-rate="1">1.0x</button>
      </div>
      <div class="customrow">
        <input type="range" id="customRate" min="0.3" max="2" step="0.1" value="1">
        <div class="val" id="customVal">1.0x</div>
      </div>
    </div>

    <div class="block">
      <h2>履歴</h2>
      <div class="list" id="historyList"><div class="empty-list">なし</div></div>
    </div>
  </aside>

  <main class="main">
    <div class="stage" id="stage">
      <div id="player"></div>
      <div class="click-shield" id="shield"></div>
    </div>

    <div class="transport">
      <div class="seekrow">
        <div class="time" id="curTime">0:00</div>
        <div class="seek-outer">
          <div class="seek-track">
            <div class="seek-fill" id="seekFill"></div>
            <div class="loop-band" id="loopBand"></div>
          </div>
          <div class="marker" id="markA" style="display:none;"><span class="tag">A</span></div>
          <div class="marker end" id="markB" style="display:none;"><span class="tag">B</span></div>
          <input type="range" class="seek-range" id="seekRange" min="0" max="100" value="0" step="0.1">
        </div>
        <div class="time end" id="durTime">0:00</div>
      </div>
      <div class="ctrlrow">
        <button class="playbtn" id="playBtn">▶</button>
        <button class="iconbtn" id="back1">−1秒</button>
        <button class="iconbtn" id="back05">−0.5秒</button>
        <button class="iconbtn" id="fwd05">+0.5秒</button>
        <button class="iconbtn" id="fwd1">+1秒</button>
        <div class="spacer"></div>
        <div class="rate-badge" id="rateBadge">1.0x</div>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = 'earcopy_videos_v1';
const LAST_KEY  = 'earcopy_last_v1';

function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; }
}
function saveStore(store){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function getVideoEntry(id){
  const store = loadStore();
  if(!store[id]) store[id] = { id, url:'', addedAt: Date.now(), presets: [], lastSpeed: 1 };
  return store[id];
}
function upsertVideoEntry(entry){
  const store = loadStore();
  store[entry.id] = entry;
  saveStore(store);
}

/* ---------- url parsing ---------- */
function parseYouTubeId(raw){
  if(!raw) return null;
  raw = raw.trim();
  try{
    const u = new URL(raw);
    const host = u.hostname.replace(/^www\./,'');
    if(host === 'youtu.be'){
      const id = u.pathname.slice(1).split('/')[0];
      return id || null;
    }
    if(host.endsWith('youtube.com')){
      if(u.pathname === '/watch'){ return u.searchParams.get('v'); }
      const parts = u.pathname.split('/').filter(Boolean);
      if((parts[0]==='embed' || parts[0]==='shorts' || parts[0]==='live') && parts[1]){
        return parts[1];
      }
    }
  }catch(e){ /* not a full URL */ }
  const m = raw.match(/^[a-zA-Z0-9_-]{11}$/);
  return m ? raw : null;
}

/* ---------- time helpers ---------- */
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  if(h>0) return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0');
}
function parseTime(str){
  if(!str) return 0;
  const parts = str.trim().split(':').map(x=>parseInt(x,10)||0);
  let sec = 0;
  for(const p of parts){ sec = sec*60 + p; }
  return sec;
}

/* ---------- state ---------- */
let player = null;
let playerReady = false;
let currentId = null;
let duration = 0;
let loopOn = false;
let startSec = 0, endSec = 0;
let rafId = null;
let dragging = false;

const $ = sel => document.querySelector(sel);
const msg = $('#msg');
const shield = $('#shield');
const playBtn = $('#playBtn');
const seekRange = $('#seekRange');
const seekFill = $('#seekFill');
const loopBand = $('#loopBand');
const markA = $('#markA');
const markB = $('#markB');
const curTime = $('#curTime');
const durTime = $('#durTime');
const startInput = $('#startInput');
const endInput = $('#endInput');
const loopToggle = $('#loopToggle');
const loopStatus = $('#loopStatus');
const rateBadge = $('#rateBadge');
const customRate = $('#customRate');
const customVal = $('#customVal');

/* ---------- YouTube IFrame API ---------- */
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  playerReady = true;
  const last = localStorage.getItem(LAST_KEY);
  if(last){ loadVideo(last, true); }
};

function ensurePlayer(id, resumeState){
  if(!player){
    player = new YT.Player('player', {
      videoId: id,
      playerVars:{
        autoplay:0, controls:0, disablekb:1, rel:0, modestbranding:1,
        playsinline:1, iv_load_policy:3, fs:0
      },
      events:{
        onReady: ()=> onPlayerReady(resumeState),
        onStateChange: onPlayerStateChange
      }
    });
  } else {
    player.cueVideoById(id);
    setTimeout(()=> onPlayerReady(resumeState), 400);
  }
}

function onPlayerReady(resumeState){
  duration = player.getDuration() || 0;
  durTime.textContent = fmtTime(duration);
  seekRange.max = duration || 100;
  if(resumeState && resumeState.speed){ setRate(resumeState.speed, false); }
  updateLoopUI();
  loopVisualLoop();
}

function onPlayerStateChange(e){
  playBtn.textContent = (e.data === YT.PlayerState.PLAYING) ? '❚❚' : '▶';
  if(e.data === YT.PlayerState.PLAYING && !duration){
    duration = player.getDuration() || 0;
    durTime.textContent = fmtTime(duration);
    seekRange.max = duration || 100;
  }
}

/* ---------- main render loop ---------- */
function loopVisualLoop(){
  cancelAnimationFrame(rafId);
  function tick(){
    if(playerReady && player && player.getCurrentTime){
      const t = player.getCurrentTime();
      if(!dragging){
        seekRange.value = t;
        seekFill.style.width = duration ? (t/duration*100)+'%' : '0%';
        curTime.textContent = fmtTime(t);
      }
      if(loopOn && endSec > startSec && t >= endSec - 0.15){
        player.seekTo(startSec, true);
        player.playVideo();
      }
    }
    rafId = requestAnimationFrame(tick);
  }
  tick();
}

/* ---------- load video flow ---------- */
function loadVideo(rawUrlOrId, isResume){
  const id = parseYouTubeId(rawUrlOrId);
  if(!id){ msg.textContent = '有効なYouTubeのURLを入力してください'; return; }
  msg.textContent = '';
  currentId = id;
  localStorage.setItem(LAST_KEY, isResume ? rawUrlOrId : id);
  $('#urlInput').value = '';

  const entry = getVideoEntry(id);
  if(!isResume){
    entry.url = rawUrlOrId.includes('http') ? rawUrlOrId : ('https://youtu.be/'+id);
    entry.addedAt = Date.now();
    upsertVideoEntry(entry);
  }

  startSec = 0; endSec = 0; loopOn = false;
  loopToggle.checked = false;
  updateLoopUI();
  startInput.value = fmtTime(0);
  endInput.value = fmtTime(0);

  if(playerReady){ ensurePlayer(id, { speed: entry.lastSpeed }); }

  renderPresets();
  renderHistory();
}

$('#loadBtn').addEventListener('click', ()=>{
  const v = $('#urlInput').value.trim();
  if(v) loadVideo(v, false);
});
$('#urlInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#loadBtn').click(); });

/* ---------- transport controls ---------- */
function togglePlay(){
  if(!player) return;
  const state = player.getPlayerState();
  if(state === YT.PlayerState.PLAYING) player.pauseVideo();
  else player.playVideo();
}
playBtn.addEventListener('click', togglePlay);
shield.addEventListener('click', togglePlay);

function nudge(delta){ if(player) player.seekTo(Math.max(0, player.getCurrentTime()+delta), true); }
$('#back1').addEventListener('click', ()=> nudge(-1));
$('#back05').addEventListener('click', ()=> nudge(-0.5));
$('#fwd05').addEventListener('click', ()=> nudge(0.5));
$('#fwd1').addEventListener('click', ()=> nudge(1));

document.addEventListener('keydown', e=>{
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if(e.code === 'ArrowRight'){ e.preventDefault(); nudge(0.5); }
  else if(e.code === 'ArrowLeft'){ e.preventDefault(); nudge(-0.5); }
});

seekRange.addEventListener('input', ()=>{
  dragging = true;
  curTime.textContent = fmtTime(seekRange.value);
  seekFill.style.width = duration ? (seekRange.value/duration*100)+'%':'0%';
});
seekRange.addEventListener('change', ()=>{
  let target = parseFloat(seekRange.value);
  if(loopOn && endSec > startSec && (target < startSec || target > endSec)){
    target = startSec;
    seekRange.value = target;
  }
  if(player) player.seekTo(target, true);
  dragging = false;
});

/* ---------- loop A/B ---------- */
function updateLoopUI(){
  loopStatus.textContent = 'ループ ' + (loopOn ? 'ON' : 'OFF');
  if(duration>0 && endSec>startSec){
    markA.style.display = 'block';
    markB.style.display = 'block';
    markA.style.left = (startSec/duration*100)+'%';
    markB.style.left = (endSec/duration*100)+'%';
    loopBand.style.display = 'block';
    loopBand.style.left = (startSec/duration*100)+'%';
    loopBand.style.width = ((endSec-startSec)/duration*100)+'%';
  } else {
    markA.style.display = (endSec>0 || startSec>0) ? 'block' : 'none';
    if(markA.style.display==='block') markA.style.left = duration ? (startSec/duration*100)+'%':'0%';
    markB.style.display = 'none';
    loopBand.style.display = 'none';
  }
}

$('#setA').addEventListener('click', ()=>{
  if(!player) return;
  startSec = player.getCurrentTime();
  startInput.value = fmtTime(startSec);
  updateLoopUI();
});
$('#setB').addEventListener('click', ()=>{
  if(!player) return;
  endSec = player.getCurrentTime();
  endInput.value = fmtTime(endSec);
  updateLoopUI();
});
startInput.addEventListener('change', ()=>{ startSec = parseTime(startInput.value); updateLoopUI(); });
endInput.addEventListener('change', ()=>{ endSec = parseTime(endInput.value); updateLoopUI(); });

document.querySelectorAll('.nudgebtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const target = b.dataset.t;
    const delta = parseFloat(b.dataset.d);
    if(target === 'start'){
      startSec = Math.max(0, startSec + delta);
      startInput.value = fmtTime(startSec);
      if(player) player.seekTo(startSec, true);
    } else {
      endSec = Math.max(0, endSec + delta);
      endInput.value = fmtTime(endSec);
      if(player) player.seekTo(endSec, true);
    }
    updateLoopUI();
  });
});

loopToggle.addEventListener('change', ()=>{
  loopOn = loopToggle.checked;
  if(loopOn && endSec<=startSec){
    msg.textContent = '終了(B)は開始(A)より後の時間にしてください';
    loopToggle.checked = false;
    loopOn = false;
  } else {
    msg.textContent = '';
  }
  updateLoopUI();
});

/* ---------- speed ---------- */
function setRate(rate, persist){
  rate = Math.round(rate*100)/100;
  if(player && player.setPlaybackRate){
    player.setPlaybackRate(rate);
    setTimeout(()=>{
      const actual = player.getPlaybackRate ? player.getPlaybackRate() : rate;
      rateBadge.textContent = actual.toFixed(2).replace(/0$/,'').replace(/\.$/,'.0') + 'x';
    }, 150);
  }
  document.querySelectorAll('.speedbtn').forEach(b=>{
    b.classList.toggle('active', Math.abs(parseFloat(b.dataset.rate)-rate) < 0.001);
  });
  customRate.value = rate;
  customVal.textContent = rate.toFixed(1)+'x';
  if(persist !== false && currentId){
    const entry = getVideoEntry(currentId);
    entry.lastSpeed = rate;
    upsertVideoEntry(entry);
  }
}
document.querySelectorAll('.speedbtn').forEach(b=>{
  b.addEventListener('click', ()=> setRate(parseFloat(b.dataset.rate)));
});
customRate.addEventListener('input', ()=>{ customVal.textContent = parseFloat(customRate.value).toFixed(1)+'x'; });
customRate.addEventListener('change', ()=> setRate(parseFloat(customRate.value)));

/* ---------- presets ---------- */
$('#savePreset').addEventListener('click', ()=>{
  if(!currentId){ msg.textContent = '先に動画を読み込んでください'; return; }
  if(endSec<=startSec){ msg.textContent = 'A/Bのループ範囲を先に設定してください'; return; }
  const nameInput = $('#presetName');
  const name = nameInput.value.trim() || ('ループ '+fmtTime(startSec)+'〜'+fmtTime(endSec));
  const entry = getVideoEntry(currentId);
  entry.presets.push({ id: Date.now().toString(36), name, start: startSec, end: endSec, createdAt: Date.now() });
  upsertVideoEntry(entry);
  nameInput.value = '';
  msg.textContent = '';
  renderPresets();
});

function renderPresets(){
  const listEl = $('#presetList');
  if(!currentId){ listEl.innerHTML = '<div class="empty-list">なし</div>'; return; }
  const entry = getVideoEntry(currentId);
  if(!entry.presets.length){ listEl.innerHTML = '<div class="empty-list">なし</div>'; return; }
  listEl.innerHTML = '';
  entry.presets.slice().reverse().forEach(p=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${fmtTime(p.start)} → ${fmtTime(p.end)}</div>
      </div>
      <div class="acts">
        <button title="呼び出す" data-act="load">▶</button>
        <button title="削除" data-act="del">✕</button>
      </div>`;
    div.querySelector('[data-act="load"]').addEventListener('click', ()=>{
      startSec = p.start; endSec = p.end;
      startInput.value = fmtTime(startSec);
      endInput.value = fmtTime(endSec);
      loopOn = true; loopToggle.checked = true;
      updateLoopUI();
      if(player) player.seekTo(startSec, true);
    });
    div.querySelector('[data-act="del"]').addEventListener('click', ()=>{
      const e2 = getVideoEntry(currentId);
      e2.presets = e2.presets.filter(x=>x.id!==p.id);
      upsertVideoEntry(e2);
      renderPresets();
    });
    listEl.appendChild(div);
  });
}

/* ---------- history ---------- */
function renderHistory(){
  const listEl = $('#historyList');
  const store = loadStore();
  const ids = Object.keys(store).sort((a,b)=> store[b].addedAt - store[a].addedAt).slice(0,12);
  if(!ids.length){ listEl.innerHTML = '<div class="empty-list">なし</div>'; return; }
  listEl.innerHTML = '';
  ids.forEach(id=>{
    const e = store[id];
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <img class="thumb" src="https://img.youtube.com/vi/${id}/default.jpg" alt="">
      <div class="info">
        <div class="name">${id === currentId ? '● ' : ''}${escapeHtml(id)}</div>
        <div class="meta">${e.presets.length}件</div>
      </div>
      <div class="acts">
        <button title="開く" data-act="open">▶</button>
        <button title="削除" data-act="del">✕</button>
      </div>`;
    div.querySelector('[data-act="open"]').addEventListener('click', ()=> loadVideo(e.url || id, false));
    div.querySelector('[data-act="del"]').addEventListener('click', ()=>{
      const s = loadStore();
      delete s[id];
      saveStore(s);
      renderHistory();
    });
    listEl.appendChild(div);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

renderHistory();
</script>
</body>
</html>
